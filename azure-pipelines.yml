# Build, test, pack, and publish the SharpNinja.Valhalla NuGet package via the Nuke build.
# Runs on the self-hosted "Default" agent pool.
#
# Required pipeline variable (set as a secret in the pipeline settings):
#   NUGET_API_KEY - API key with push rights for the SharpNinja.Valhalla package on nuget.org.

trigger:
  branches:
    include:
      - main

pool: Default

variables:
  configuration: 'Release'

steps:
  # Fresh working tree each run: the persisted self-hosted agent would otherwise keep prior
  # artifacts/output around (the Nuke Pack/Test targets also self-clean their output dirs).
  - checkout: self
    clean: true

  - task: UseDotNet@2
    displayName: 'Use .NET 10 SDK'
    inputs:
      packageType: sdk
      version: '10.0.x'
      includePreviewVersions: true

  # The Nuke Publish target chains Restore -> Compile -> Test -> Pack -> Publish. Pack cleans
  # artifacts/nuget and Publish pushes only the freshly-produced package. The NuGet API key is
  # passed through the environment (read by the Publish target as NUGET_API_KEY); Publish fails
  # fast if it is unset.
  - pwsh: ./build.ps1 Publish --configuration $(configuration)
    displayName: 'Nuke: Restore, Compile, Test, Pack, Publish'
    env:
      NUGET_API_KEY: $(NUGET_API_KEY)

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Build.SourcesDirectory)/artifacts/test-results'

  - publish: '$(Build.SourcesDirectory)/artifacts/nuget'
    artifact: nuget
    displayName: 'Publish pipeline artifact (nupkg)'
    condition: succeeded()
